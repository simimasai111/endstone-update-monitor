name: Check Release Update


on:

  schedule:

    - cron: "0 */6 * * *"


  workflow_dispatch:



jobs:

  check:


    runs-on: ubuntu-latest


    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.x"



      - name: Install

        run: |

          pip install requests



      - name: Run

        run: |

          python monitor.py



      - name: Commit

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add .

          git commit -m "Update release notes" || true

          git push
